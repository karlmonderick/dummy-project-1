<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registration Form</title>
    <link rel="stylesheet" href="3forms.css" />
</head>

<body>
    <div class="header">
    <h1>Registration Form</h1>
    <p>Please fill out this form with the required information</p>
    </div>
    
   
        <form action="https://register-demo.freecodecamp.org"></form>
        <fieldset class="create">  
            <label for="first-name">Enter Your First Name: <input class="logins" type="text" name="first-name" id="first-name" required></label>
            
            <label for="last-name">Enter Your Last Name: <input class="logins" type="text" name="last-name" id="last-name" required></label>
            
    
            <label for="email">Enter Your Email: <input class="logins" type="email" name="email" id="email" required></label>
            
    
            <label for="new-password">Create a New Password: <input class="logins" type="password" name="new-password" id="new-password" required></label>
        </fieldset>

    <hr>
    </fieldset>
    <label for="account">Account type (required)</label> 
    <label for ="personal"><input type="radio" name="personal-business" id="personal" required>Personal</label>
    <label for ="business"><input type="radio" name="personal-business" id="business" required>Business</label>


    <fieldset>

        <hr>

    <fieldset>
        <label for="picture">Upload a profile picture:<input type="file" name="picture" id="picture" required></label>
        <label for="age">Input your age (years):<input type="number" name="age" id="age" required></label>
        <label for="referrer">How did you hear about us?<input type="list" name="referrer" id="referrer" required></label>
        <label for="bio">Provide a bio:<input type="text" name="bio" id="bio" placeholder="I like coding on the beach..."></label>
  
        <label for="terms"><input checked type="checkbox" name="terms" id="terms" required>I agree to the terms and conditions</label>

    </fieldset>
    </div>
   
</body>

</html>
